# The demo backend. DATABASE_URL (its own Neon branch) is a secret:
#   fly secrets set -a bigs-live-demo DATABASE_URL='postgres://…'
# Deploy with `make fly-deploy SITE=demo`.
app = "bigs-live-demo"
primary_region = "fra"  # next to Neon (eu-central-1)

[env]
  # A demo race that stands at this moment until the site moves it.
  CLOCK_START = "2026-10-18T18:00:00Z"

[http_service]
  internal_port = 8080
  force_https = true
  # Exactly one machine, always on: the scheduler and the state are in-process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
