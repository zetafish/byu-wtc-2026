server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS. With the upstream in a variable, nginx re-resolves `app`
  # per request instead of once at startup, so restarting the backend
  # (new container IP) doesn't leave the site on 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://app:8080;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
