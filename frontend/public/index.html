<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WTC 2026 Live</title>
  <meta name="description" content="Live stats of the Big's Backyard Ultra World Team Championship 2026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&display=block">
  <!-- Chinese runner names (TPE): a fallback for devices without a CJK font.
       Google serves it in unicode-range slices, so only the characters on the
       page download; swap, so it never holds up the Latin text -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <!-- the saved theme before first paint, so a dark page doesn't flash light -->
  <script>try { var t = JSON.parse(localStorage.getItem("wtc-prefs") || "{}").theme;
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div id="app"></div>
  <script src="/js/main.js"></script>
  <!-- Vercel Web Analytics (no cookies): visitors, referrers, countries. Only
       answers on Vercel; locally the script is a harmless 404. The views are
       hashes, which it would all count as "/", so it doesn't track by itself:
       the app reports each view as a path (wtc.app/track-view!). -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js" data-disable-auto-track="1"></script>
</body>
</html>
