<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WTC 2026 Live</title>
  <meta name="description" content="Live stats of the Big's Backyard Ultra World Team Championship 2026">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- the saved theme before first paint, so a dark page doesn't flash light -->
  <script>try { var t = JSON.parse(localStorage.getItem("wtc-prefs") || "{}").theme;
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>

</body>
