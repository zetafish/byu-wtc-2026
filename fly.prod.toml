# The prod backend. DATABASE_URL (its own Neon branch) is a secret:
#   fly secrets set -a bigs-live DATABASE_URL='postgres://…'
# Deploy with `make fly-deploy SITE=prod`.
app = "bigs-live"
primary_region = "fra"  # next to Neon (eu-central-1)

# No CLOCK_START: real time.
[env]
  # The official site's feed only (see wtc.source.official). Its latest copy
  # is kept on the volume, so a restart while the feed is down still has data.
  SOURCES = '[{:id :official :type :official :priority 10 :snapshot "/data/latest.json"}]'
  # A country that reports up to 45 min after the bell isn't shown as out meanwhile.
  GRACE_SECONDS = "2700"

# Create it once before deploying:
#   fly volumes create wtc_data --region fra --size 1 -a bigs-live
[mounts]
  source = "wtc_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Exactly one machine, always on: the scheduler and the state are in-process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
