# Local stack: the backend and the frontend behind nginx (stand-in for
# Vercel, which proxies /api the same way). The database is always Neon:
# DATABASE_URL (a Neon branch) comes from .env, like the clock and source
# settings. `make up DEMO=1` writes CLOCK_START there so a plain
# `docker compose up` keeps the demo race.
services:
  app:
    build: .
    ports:
      - "${PORT:-8090}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env to a Neon branch}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      CLOCK_START: ${CLOCK_START:-}
      SOURCES: ${SOURCES:-}

  web:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8091}:80"

  # Hot reload on :8092. Edits in frontend/src reload in the browser.
  web-dev:
    build:
      context: ./frontend
      target: deps
    command: npx shadow-cljs watch app
    depends_on:
      - app
    environment:
      API_URL: http://app:8080
    ports:
      - "8092:8092"   # site
      - "9630:9630"   # shadow-cljs (hot reload websocket, build UI)
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/shadow-cljs.edn:/app/shadow-cljs.edn
