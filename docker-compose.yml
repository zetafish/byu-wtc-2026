# Local stack: Postgres (stand-in for Neon), the backend, and the frontend
# behind nginx (stand-in for Vercel, which proxies /api the same way).
# Clock/source settings come from the shell or from .env, which `make up DEMO=1`
# writes so a plain `docker compose up` keeps the demo clock.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wtc
      POSTGRES_PASSWORD: wtc
      POSTGRES_DB: wtc
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtc -d wtc"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8090}:8080"
    environment:
      DATABASE_URL: postgres://wtc:wtc@db:5432/wtc
      POLL_SECONDS: ${POLL_SECONDS:-60}
      CLOCK_START: ${CLOCK_START:-}
      CLOCK_SPEED: ${CLOCK_SPEED:-1}
      CLOCK_ANCHOR: ${CLOCK_ANCHOR:-}
      SOURCES: ${SOURCES:-}

  web:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8091}:80"

  # Hot reload on :8092. Edits in frontend/src reload in the browser.
  web-dev:
    build:
      context: ./frontend
      target: deps
    command: npx shadow-cljs watch app
    depends_on:
      - app
    environment:
      API_URL: http://app:8080
    ports:
      - "8092:8092"   # site
      - "9630:9630"   # shadow-cljs (hot reload websocket, build UI)
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/shadow-cljs.edn:/app/shadow-cljs.edn

volumes:
  pgdata:
